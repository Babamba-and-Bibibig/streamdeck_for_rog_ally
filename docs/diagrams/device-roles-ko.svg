<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="528" viewBox="0 0 1280 528" role="img" aria-labelledby="title description">
  <title id="title">Mac은 작업, Ally는 리모컨</title>
  <desc id="description">왼쪽 Mac의 macOS에서 Codex와 OrangeDeck Agent를 실행합니다. 오른쪽 ROG Ally의 CachyOS Handheld에서 리모컨을 실행합니다. Tailscale로 작업 상태와 승인·거절을 주고받습니다. Steam Deck과 SteamOS는 아직 확인하지 않았습니다.</desc>
