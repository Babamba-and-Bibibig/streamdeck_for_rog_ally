  <title id="title">Mac runs Codex. Ally is the remote.</title>
  <desc id="description">Left: Codex and OrangeDeck Connector on a macOS Mac. Right: the OrangeDeck remote on a ROG Ally running CachyOS Handheld. Tailscale carries activity, replies and file records to the Ally, and approval decisions and file-open requests to the Mac.</desc>
