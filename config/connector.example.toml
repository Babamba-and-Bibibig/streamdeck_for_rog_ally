host_name = "CODEX HOST"
bind_mode = "tailscale"
port = 45831
token_file = "~/.config/orangedeck/connector.token"
cargo_binary = "/Users/YOU/.cargo/bin/cargo"
codex_binary = "/Users/YOU/.local/bin/codex"
# auto selects the first installed editor: Zed, VS Code, Cursor, VSCodium.
editor = "auto" # auto / zed / vs_code / cursor / vscodium
log_level = "info"

[[projects]]
id = "main-project"
name = "Main Project"
path = "/Users/YOU/Code/main-project"
browser_url = "http://127.0.0.1:3000"
