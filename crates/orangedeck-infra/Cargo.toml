[package]
name = "orangedeck-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true

[dependencies]
async-trait.workspace = true
chrono.workspace = true
directories.workspace = true
nix.workspace = true
orangedeck-domain = { path = "../orangedeck-domain" }
orangedeck-protocol = { path = "../orangedeck-protocol" }
serde.workspace = true
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
url.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFString", "CFRunLoop", "CFDate"] }
objc2-core-services = { version = "0.3.2", default-features = false, features = ["std", "FSEvents"] }

# Only file_capture/macos.rs may call the native FSEvents callback API.
# The other five crates retain the workspace's forbid setting.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
